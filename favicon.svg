<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#faf5ee"/>
      <stop offset="100%" stop-color="#f2e8dc"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECC880"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9A7B38"/>
    </linearGradient>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B82B53"/>
      <stop offset="100%" stop-color="#7A1532"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#9A2143" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Luxury Circle with Gold Rim -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#9A2143" stroke-width="0.8" stroke-dasharray="2 1.5" opacity="0.4"/>

  <!-- Top Diamond Jewel -->
  <g filter="url(#softGlow)">
    <polygon points="32,7 37.5,13.5 32,20 26.5,13.5" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="0.75"/>
    <polygon points="32,8.5 36,13.5 32,18.5 28,13.5" fill="#C5A059" opacity="0.75"/>
    <circle cx="32" cy="13.5" r="1.8" fill="#FFFFFF"/>
  </g>

  <!-- Sculpted Interlocking Letter "A" -->
  <path d="M21 47.5 L32 23.5 L43 47.5" stroke="#1A1A1A" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Crossbar with Maroon Accent -->
  <path d="M24.5 40 L39.5 40" stroke="url(#maroonGrad)" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Flowing Royal Ribbon Flourish -->
  <path d="M15 42 C15 54, 32 58.5, 48 50 C50.5 48.8, 52 45.5, 49.5 44 C47 42.5, 44 44.5, 42 46.5" 
        stroke="url(#maroonGrad)" stroke-width="2.5" stroke-linecap="round"/>
        
  <!-- Sparkle Accent -->
  <circle cx="47" cy="16" r="1.2" fill="#C5A059"/>
  <circle cx="17" cy="19" r="1" fill="#C5A059"/>
</svg>
