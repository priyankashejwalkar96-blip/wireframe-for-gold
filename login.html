<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Account | Auro &amp; Jewellary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="auth-service.js"></script>
  <link rel="stylesheet" href="styles.css?v=20261124">
  <style>
    body { background: #faf8f5; color: #222; font-family: 'Montserrat', sans-serif; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
    .auth-container { max-width: 460px; margin: 3rem auto; padding: 2.2rem; background: #fff; border: 1px solid #ebd9c8; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); }
    .auth-title { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; font-weight: 700; text-align: center; color: #1a1a1a; margin-bottom: 0.5rem; }
    .auth-subtitle { text-align: center; font-size: 0.85rem; color: #777; margin-bottom: 1.8rem; }
    .tabs-header { display: flex; border-bottom: 2px solid #f0eae1; margin-bottom: 1.5rem; }
    .tab-trigger { flex: 1; padding: 0.8rem; text-align: center; font-weight: 600; font-size: 0.85rem; background: none; border: none; cursor: pointer; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
    .tab-trigger.active { color: #9A2143; border-bottom: 2px solid #9A2143; margin-bottom: -2px; }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.78rem; font-weight: 600; text-transform: uppercase; color: #555; margin-bottom: 0.4rem; }
    .form-control { width: 100%; padding: 0.8rem 1rem; border: 1px solid #d8cfc4; border-radius: 4px; font-size: 0.9rem; outline: none; transition: 0.2s; }
    .form-control:focus { border-color: #9A2143; box-shadow: 0 0 0 2px rgba(154,33,67,0.1); }
    .gold-btn { width: 100%; background: #9A2143; color: #fff; padding: 0.95rem; border: none; border-radius: 4px; font-weight: 600; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.3s; margin-top: 0.5rem; }
    .gold-btn:hover { background: #7b1834; }
    .profile-card { text-align: center; }
    .avatar-circle { width: 70px; height: 70px; border-radius: 50%; background: #fff0f3; color: #9A2143; font-size: 1.8rem; font-weight: bold; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; border: 2px solid #9A2143; }
  </style>
</head>
<body>

  <!-- Minimal Header -->
  <header style="background: #fff; border-bottom: 1px solid #ebd9c8; padding: 1.2rem 0; text-align: center;">
    <a href="index.html" style="font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 700; color: #1a1a1a; text-decoration: none;">
      Auro &amp; <span style="color: #9A2143;">Jewellary</span>
    </a>
  </header>

  <main style="flex: 1; display: flex; align-items: center;">
    <div class="auth-container">
      
      <!-- LOGGED IN VIEW -->
      <div id="loggedInView" class="profile-card" style="display: none;">
        <div class="avatar-circle" id="userInitial">👤</div>
        <h2 id="userName" style="font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; margin-bottom: 0.2rem;">Welcome</h2>
        <p id="userEmail" style="font-size: 0.85rem; color: #666; margin-bottom: 1.5rem;">user@example.com</p>

        <div style="background: #fffcf8; border: 1px solid #ebd9c8; border-radius: 6px; padding: 1rem; text-align: left; margin-bottom: 1.5rem; font-size: 0.85rem;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
            <span style="color: #777;">Account Type:</span>
            <strong id="userRole" style="text-transform: uppercase; color: #9A2143;">Customer</strong>
          </div>
          <div style="display: flex; justify-content: space-between;">
            <span style="color: #777;">Privilege:</span>
            <span style="color: #16a34a; font-weight: 600;">Complimentary Insured Shipping</span>
          </div>
        </div>

        <div style="display: flex; gap: 0.8rem; flex-direction: column;">
          <a href="track-order.html" class="gold-btn" style="text-decoration: none; display: block; text-align: center;">Track My Orders</a>
          <a href="admin.html" id="adminPanelLink" class="gold-btn" style="background: #111; text-decoration: none; display: none; text-align: center;">👑 Open Admin Dashboard</a>
          <button onclick="AuthService.signOut()" style="background: none; border: 1px solid #d8cfc4; padding: 0.7rem; border-radius: 4px; cursor: pointer; color: #555; font-weight: 600;">Sign Out</button>
        </div>
      </div>

      <!-- AUTH FORMS (SIGN IN / SIGN UP) -->
      <div id="authFormsView">
        <h1 class="auth-title">Royal Privilege Club</h1>
        <p class="auth-subtitle">Sign in or register to manage your handcrafted jewellery orders</p>

        <div class="tabs-header">
          <button class="tab-trigger active" id="tabSignInBtn" onclick="switchAuthTab('signin')">Sign In</button>
          <button class="tab-trigger" id="tabSignUpBtn" onclick="switchAuthTab('signup')">Create Account</button>
        </div>

        <!-- SIGN IN FORM -->
        <form id="signInForm" onsubmit="handleSignIn(event)">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="loginEmail" required placeholder="e.g. radhika@example.com" class="form-control">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" required placeholder="••••••••" class="form-control">
          </div>
          <button type="submit" id="signInSubmitBtn" class="gold-btn">Sign In</button>
        </form>

        <!-- SIGN UP FORM -->
        <form id="signUpForm" onsubmit="handleSignUp(event)" style="display: none;">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="regName" required placeholder="e.g. Radhika Sharma" class="form-control">
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="regEmail" required placeholder="radhika@example.com" class="form-control">
          </div>
          <div class="form-group">
            <label>Phone / WhatsApp</label>
            <input type="tel" id="regPhone" required placeholder="9876543210" class="form-control">
          </div>
          <div class="form-group">
            <label>Create Password</label>
            <input type="password" id="regPassword" required placeholder="••••••••" class="form-control">
          </div>
          <button type="submit" id="signUpSubmitBtn" class="gold-btn">Create Free Account</button>
        </form>
      </div>

    </div>
  </main>

  <footer style="text-align: center; padding: 1.5rem 0; font-size: 0.8rem; color: #888;">
    &copy; 2025 Auro &amp; Jewellary. All Rights Reserved.
  </footer>

  <script>
    function switchAuthTab(tab) {
      if (tab === 'signin') {
        document.getElementById('signInForm').style.display = 'block';
        document.getElementById('signUpForm').style.display = 'none';
        document.getElementById('tabSignInBtn').classList.add('active');
        document.getElementById('tabSignUpBtn').classList.remove('active');
      } else {
        document.getElementById('signInForm').style.display = 'none';
        document.getElementById('signUpForm').style.display = 'block';
        document.getElementById('tabSignInBtn').classList.remove('active');
        document.getElementById('tabSignUpBtn').classList.add('active');
      }
    }

    async function handleSignIn(e) {
      e.preventDefault();
      const btn = document.getElementById('signInSubmitBtn');
      btn.innerText = 'Signing In...';
      btn.disabled = true;

      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPassword').value;

      const res = await AuthService.signIn(email, pass);
      if (res.success) {
        if (res.user.role === 'admin') {
          alert('Welcome Administrator!');
          window.location.href = 'admin.html';
        } else {
          alert(`Welcome back, ${res.user.full_name || 'Valued Customer'}!`);
          checkLoginState();
        }
      } else {
        alert(res.message || 'Login failed. Please verify credentials.');
        btn.innerText = 'Sign In';
        btn.disabled = false;
      }
    }

    async function handleSignUp(e) {
      e.preventDefault();
      const btn = document.getElementById('signUpSubmitBtn');
      btn.innerText = 'Creating Account...';
      btn.disabled = true;

      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const phone = document.getElementById('regPhone').value;
      const pass = document.getElementById('regPassword').value;

      const res = await AuthService.signUp(name, email, phone, pass);
      if (res.success) {
        alert(`Account created successfully! Welcome, ${res.user.full_name}.`);
        checkLoginState();
      }
    }

    function checkLoginState() {
      const user = AuthService.getCurrentUser();
      if (user) {
        document.getElementById('authFormsView').style.display = 'none';
        document.getElementById('loggedInView').style.display = 'block';

        document.getElementById('userName').innerText = user.full_name || 'Valued Customer';
        document.getElementById('userEmail').innerText = user.email;
        document.getElementById('userRole').innerText = user.role || 'Customer';
        document.getElementById('userInitial').innerText = (user.full_name || user.email).charAt(0).toUpperCase();

        if (user.role === 'admin') {
          document.getElementById('adminPanelLink').style.display = 'block';
        }
      } else {
        document.getElementById('authFormsView').style.display = 'block';
        document.getElementById('loggedInView').style.display = 'none';
      }
    }

    window.addEventListener('DOMContentLoaded', checkLoginState);
  </script>
  <script src="cms-engine.js"></script>
  <script src="master-cms.js"></script>
  <script src="universal-cms.js"></script>
</body>
</html>
